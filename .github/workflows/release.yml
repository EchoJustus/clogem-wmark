# SPDX-FileCopyrightText: 2026 The clogem-wmark authors
# SPDX-License-Identifier: EPL-2.0
#
# Release: a tag v* on main -> native bundles for every platform, smoke-tested
# -> signed (Windows: Authenticode; macOS: Developer ID + notarization) ->
# SHA256SUMS with a keyless Sigstore signature, build-provenance attestations
# -> a DRAFT GitHub Release. The owner reviews and publishes the draft.
#
# Two ways to start it, both from main only (RUNBOOK.md, "Releases"):
#   - push a tag v<version> on a commit of main;
#   - from the web UI: Actions -> release -> Run workflow on main, with the
#     version. That run tags main's commit v<version> itself, once every
#     bundle is built and smoke-tested (a tag made with the workflow's token
#     starts no second run).
#
# Signing runs only in the protected `release` environment (a required
# reviewer approves each run) and only once the owner has set it up:
#   vars.WINDOWS_SIGNING = artifact-signing | jsign   (docs/adr/0002)
#   vars.MACOS_SIGNING   = developer-id                (docs/adr/0003)
# Until then those jobs are skipped and the draft says which bundles are
# unsigned. Credentials never leave that environment; every other job runs
# with read-only contents. Actions are pinned by commit SHA.
#
# FROZEN: the owner deferred code signing indefinitely (ADRs 0002 and 0003,
# rejected for now), so the variables stay unset and the signing jobs stay
# skipped. Don't enable, remove or extend them without the owner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v: X.Y.Z or X.Y.Z-rc.N (e.g. 0.1.0-rc.1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Releases come from main only
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release workflow on main, not $GITHUB_REF_NAME"; exit 1; fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; fi
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            v="$INPUT_VERSION"
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "::error::'$v' is not a version like 0.1.0 or 0.1.0-rc.1 (no leading v)"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
              echo "::error::Tag v$v exists already; choose the next version (e.g. the next -rc)"; exit 1; fi
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04,   platform: linux-x64,   graalvm: "25",     mock: "cc -shared -fPIC -O2 -pthread -o target/libwmark_engine.so native/mock/mock_engine.c", lib: target/libwmark_engine.so }
          - { os: windows-2025,   platform: windows-x64, graalvm: "25",     mock: "gcc -shared -O2 -static -o target/wmark_engine.dll native/mock/mock_engine.c", lib: target/wmark_engine.dll }
          - { os: macos-15,       platform: macos-arm64, graalvm: "25",     mock: "cc -dynamiclib -O2 -o target/libwmark_engine.dylib native/mock/mock_engine.c", lib: target/libwmark_engine.dylib }
          - { os: macos-15-intel, platform: macos-x64,   graalvm: "25.0.1", mock: "", lib: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          # deps.edn :graalvm pins macOS x64 to 25.0.1 (25.0.2 dropped it; ADR 0007)
          java-version: ${{ matrix.graalvm }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with: { cli: latest, bb: latest }
      - name: Stamp the release version into the binaries
        shell: bash
        run: printf '%s\n' "$VERSION" > desktop/resources/wmark/version.txt
      - run: clojure -T:build native :target :engine
      - name: The binary reports the release version
        shell: bash
        run: |
          out="$(target/bin/wmark version)"
          echo "$out"
          case "$out" in *"wmark $VERSION "*) ;; *) echo "::error::expected wmark $VERSION"; exit 1;; esac
      - name: nasm, to build FFmpeg's x86 assembly (a build tool; not shipped)
        if: matrix.platform == 'macos-x64'
        run: brew install nasm
      - name: Pinned LGPL FFmpeg (SHA-256 verified; macOS builds the signed source)
        run: clojure -T:build ffmpeg
      - if: matrix.mock != ''
        shell: bash
        run: ${{ matrix.mock }}
      - name: Smoke test the binaries
        shell: bash
        run: |
          mock=()
          if [ -n "${{ matrix.lib }}" ]; then mock=(--mock "${{ matrix.lib }}"); fi
          bb test/smoke/native.clj --bin target/bin --ffmpeg target/ffmpeg/${{ matrix.platform }}/bin "${mock[@]}"
      - run: clojure -T:build bundle :bundle :desktop-server :ffmpeg-dir target/ffmpeg/${{ matrix.platform }}
      - name: Smoke test the bundle
        shell: bash
        run: bb test/smoke/native.clj --bin dist/desktop-server --ffmpeg dist/desktop-server/bin --bundled true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.platform == 'linux-x64'
        with: { python-version: "3.13" }
      - name: Browser suite against the native binary
        if: matrix.platform == 'linux-x64'
        run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          # the pinned FFmpeg makes the test clip and serves the engine (the runner has none)
          PATH="$PWD/target/ffmpeg/linux-x64/bin:$PATH" \
            python3 test/e2e/ui_smoke.py target/bin/wmark --home "$RUNNER_TEMP/e2e-home" serve --announce json
      - name: Pack (tar keeps the executable bits across jobs)
        shell: bash
        run: tar -czf "unsigned-${{ matrix.platform }}.tar.gz" -C dist desktop-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.platform }}
          path: unsigned-${{ matrix.platform }}.tar.gz

  sign-windows:
    needs: build
    if: vars.WINDOWS_SIGNING == 'artifact-signing' || vars.WINDOWS_SIGNING == 'jsign'
    runs-on: windows-2025
    environment: release
    permissions: { contents: read, id-token: write }   # id-token: Azure login by OIDC, no stored secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: unsigned-windows-x64 }
      - shell: bash
        run: tar -xzf unsigned-windows-x64.tar.gz
      - name: Azure login (OIDC)
        if: vars.WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign with Azure Artifact Signing
        if: vars.WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: desktop-server
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-azure-cli-credential: false
      - name: Sign with jsign (an OV certificate whose key sits in a cloud HSM)
        if: vars.WINDOWS_SIGNING == 'jsign'
        shell: bash
        env:
          JSIGN_STORETYPE: ${{ vars.JSIGN_STORETYPE }}
          JSIGN_KEYSTORE:  ${{ vars.JSIGN_KEYSTORE }}
          JSIGN_ALIAS:     ${{ vars.JSIGN_ALIAS }}
          JSIGN_TSAURL:    ${{ vars.JSIGN_TSAURL }}
          JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
          JSIGN_CERTFILE_PEM: ${{ secrets.JSIGN_CERTFILE_PEM }}
        run: |
          curl -fsSLo jsign.jar https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  jsign.jar" | sha256sum -c
          certargs=()
          if [ -n "$JSIGN_CERTFILE_PEM" ]; then printf '%s' "$JSIGN_CERTFILE_PEM" > chain.pem; certargs=(--certfile chain.pem); fi
          java -jar jsign.jar --storetype "$JSIGN_STORETYPE" --keystore "$JSIGN_KEYSTORE" --alias "$JSIGN_ALIAS" \
            --storepass "$JSIGN_STOREPASS" "${certargs[@]}" --tsaurl "$JSIGN_TSAURL" --tsmode RFC3161 --alg SHA-256 \
            desktop-server/*.exe desktop-server/bin/*.exe
          rm -f chain.pem
      - name: Every executable carries a valid, timestamped signature
        shell: pwsh
        run: |
          Get-ChildItem desktop-server -Recurse -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { throw "$($_.Name): $($s.Status)" }
            "$($_.Name): $($s.SignerCertificate.Subject)" }
      - shell: bash
        run: tar -czf signed-windows-x64.tar.gz desktop-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: signed-windows-x64, path: signed-windows-x64.tar.gz }

  sign-macos:
    needs: build
    if: vars.MACOS_SIGNING == 'developer-id'
    runs-on: macos-15
    environment: release
    permissions: { contents: read }
    strategy:
      matrix:
        platform: [macos-arm64, macos-x64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "unsigned-${{ matrix.platform }}" }
      - run: tar -xzf "unsigned-${{ matrix.platform }}.tar.gz"
      - name: Sign every Mach-O (wmark, bin/ffmpeg, bin/ffprobe) with the hardened runtime
        env:
          CERT_P12_BASE64:  ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD:    ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          for f in desktop-server/wmark desktop-server/bin/ffmpeg desktop-server/bin/ffprobe; do
            codesign --force --options runtime --timestamp --keychain "$kc" --sign "$SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
      - name: Notarize (a zip can't be stapled; Gatekeeper checks the ticket online)
        env:
          API_KEY_P8:  ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID:  ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER:  ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent desktop-server notarize.zip
          xcrun notarytool submit notarize.zip --key "$RUNNER_TEMP/key.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/key.p8" notarize.zip
      - run: tar -czf "signed-${{ matrix.platform }}.tar.gz" desktop-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "signed-${{ matrix.platform }}", path: "signed-${{ matrix.platform }}.tar.gz" }

  publish:
    needs: [guard, build, sign-windows, sign-macos]
    # signing jobs are skipped until the owner configures them; a failed one stops the release
    if: >-
      always() && needs.build.result == 'success' &&
      needs.sign-windows.result != 'failure' && needs.sign-windows.result != 'cancelled' &&
      needs.sign-macos.result != 'failure' && needs.sign-macos.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: in }
      - name: Archives (signed where signing ran)
        run: |
          mkdir out; : > signing.txt
          for p in linux-x64 windows-x64 macos-arm64 macos-x64; do
            src="in/signed-$p/signed-$p.tar.gz"; state=signed
            [ -f "$src" ] || { src="in/unsigned-$p/unsigned-$p.tar.gz"; state=UNSIGNED; }
            [ "$p" = linux-x64 ] && state="not code-signed (Linux has no OS signing; see the checksums and attestations)"
            rm -rf stage && mkdir stage && tar -xzf "$src" -C stage
            name="wmark-$VERSION-$p"
            mv stage/desktop-server "stage/$name"
            if [ "$p" = linux-x64 ]; then tar -czf "out/$name.tar.gz" -C stage "$name"
            else (cd stage && zip -qry "../out/$name.zip" "$name"); fi
            echo "- $p: $state" >> signing.txt
          done
          (cd out && sha256sum * > SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless Sigstore signature of SHA256SUMS
        run: cosign sign-blob --yes --bundle out/SHA256SUMS.sigstore.json out/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.zip
            out/*.tar.gz
            out/SHA256SUMS
      - name: Tag main's commit (a run started from the web UI)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "wmark $VERSION: the engine (CLI, web UI, API) and FFmpeg for Windows x64, macOS (arm64, x64) and Linux x64."
            echo
            echo "## Code signing"
            cat signing.txt
            if grep -q UNSIGNED signing.txt; then
              echo
              echo "Windows and macOS warn before the first run of an unsigned build. How to open it: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/RUNBOOK.md#unsigned-downloads"
            fi
            echo
            echo "## Verify a download"
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo "gh attestation verify wmark-$VERSION-<platform>.<zip|tar.gz> --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "FFmpeg is bundled as a separate program under the LGPL (LGPL-3.0-or-later); its license and source notes are in licenses/ffmpeg/."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "wmark $VERSION" --notes-file notes.md out/*
