#
# Engine SDK: on an abi-v<N> tag (the C ABI) or a kernel-v* tag (the kernel's
# golden vectors), a DRAFT release with wmark-engine-sdk-<tag>.zip: the header,
# the mock engine, the JSON Schemas, the golden vectors, README and ENGINE.md.
# It is what a Swift, Kotlin or Rust engine and a Dart kernel port build and
# test against. abi-v<N> must match WMARK_ENGINE_ABI_VERSION in the header.
name: sdk

on:
  push:
    tags: ["abi-v*", "kernel-v*"]

permissions: {}

jobs:
  sdk:
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Tags come from main only
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "25" }
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with: { cli: latest, bb: latest }
      - name: The SDK's contracts hold at this commit (golden vectors, the C ABI through the mock)
        run: >-
          clojure -M:dev:test -n watermark.util.prng-test -n watermark.core.seeds-test
          -n watermark.render-test -n watermark.engine.native-test -n wmark.build-test
      - run: clojure -T:build sdk :name '"${{ github.ref_name }}"'
      - name: Checksums
        run: cd dist && sha256sum wmark-engine-sdk-*.zip > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/wmark-engine-sdk-*.zip
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Engine SDK $GITHUB_REF_NAME" \
            --notes "The C ABI, mock engine, JSON Schemas and golden vectors at $GITHUB_REF_NAME. See README.md inside." \
            dist/wmark-engine-sdk-*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
