#
# Tests on every push to main and every pull request; native binaries per OS
# on version tags (or by hand). native-image can't cross-compile, so every OS
# builds its own; the Windows runner provides MSVC, which setup-graalvm wires
# up for native-image. Public repository: standard runners cost nothing.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open-core guard (nothing from the commercial repository)
        # The patterns are written so this file doesn't match itself.
        run: |
          set -u
          bad=0
          if grep -rIl --exclude-dir=.git 'LicenseRef-clogem-propri[e]tary' .; then
            echo "::error::a file carries the commercial repository's license marker"; bad=1; fi
          if grep -rIlE --exclude-dir=.git --include='*.clj*' '\(ns[[:space:]]+watermark\.(pr[o]|saa[s])([.[:space:]]|$)' .; then
            echo "::error::a commercial namespace is defined here"; bad=1; fi
          for p in pro saas gui dev secrets docs/COMMERCIAL.md docs/REPO_STRATEGY.md; do
            if [ -e "$p" ]; then echo "::error::$p must not exist in this repository"; bad=1; fi; done
          exit $bad
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: DeLaGuardo/setup-clojure@12.5      # Dependabot keeps this current
        with: { cli: latest, bb: latest }
      - name: Test prerequisites (FFmpeg and a font for the conformance tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: bb lint
      - run: bb test

  native:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        target: [engine, tui]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeLaGuardo/setup-clojure@12.5
        with: { cli: latest, bb: latest }
      - run: clojure -T:build native :target :${{ matrix.target }}
      - name: Smoke-test the binary
        shell: bash
        run: ./target/bin/wmark* --help
      # Next: sign (Authenticode / notarization), `bb bundle :bundle
      # :desktop-server :ffmpeg-dir ...` with a full FFmpeg build, attach to the release.
      - uses: actions/upload-artifact@v4
        with:
          name: wmark-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}
          path: target/bin/
