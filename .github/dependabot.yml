#
# Keeps the actions in .github/workflows current. Dependabot also updates
# actions pinned by commit SHA, and the version comment on the same line
# (`uses: owner/action@<sha> # v1.2.3`).
#
# deps.edn isn't covered: Dependabot has no tools.deps ecosystem. JVM
# dependencies are bumped by hand, with the reason in the pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # the kernel's Dart VM harness: its one package, crypto (ClojureDart is a
  # git dependency in kernel/dart/deps.edn, bumped by hand like deps.edn)
  - package-ecosystem: pub
    directory: /kernel/dart
    schedule:
      interval: weekly
